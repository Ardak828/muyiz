<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oyu Resonance - Muyiz, 2025</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh;min-height:100dvh;display:grid;place-items:center}main{width:100%;text-align:center;padding:12px}video{display:block;margin:auto;max-width:95vw;max-height:calc(100vh - 140px);max-height:calc(100dvh - 140px);width:auto;height:auto;object-fit:contain;border-radius:8px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 8px}button,a{font:inherit;color:#fff}button{border:1px solid #777;background:#222;border-radius:24px;padding:11px 18px;cursor:pointer;min-height:44px}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:4px}[hidden]{display:none!important}p{font-size:14px;line-height:1.4;margin:8px auto;max-width:40em}a{font-size:13px;color:#bbb}
</style></head><body><main>
<video id="video" autoplay muted playsinline webkit-playsinline controls preload="auto" src="Muyiz.mp4">Your browser does not support video.</video>
<div class="actions"><button id="sound" type="button">Enable sound</button><button id="play" type="button">Play video</button><button id="retry" type="button" hidden>Retry loading</button></div>
<p id="status" role="status" aria-live="polite">Loading video...</p>
<a href="Muyiz.mp4">Open video directly</a>
</main><script>
const v=document.getElementById('video'), sound=document.getElementById('sound'), play=document.getElementById('play'), retry=document.getElementById('retry'), status=document.getElementById('status');
let timer;
function slow(){clearTimeout(timer);timer=setTimeout(()=>{if(v.paused||v.readyState<3){status.textContent='Loading is taking longer. Tap Play, retry, or open the video directly.';play.hidden=false;retry.hidden=false;}},12000);}
function start(){slow();const result=v.play();if(result)result.catch(()=>{clearTimeout(timer);status.textContent=v.error?'Video could not load. Retry or open it directly.':'Tap Play to start the video.';play.hidden=false;retry.hidden=!v.error;});}
v.defaultMuted=true;v.muted=true;
sound.addEventListener('click',()=>{v.muted=!v.muted;if(v.paused)start();});
play.addEventListener('click',start);
retry.addEventListener('click',()=>{status.textContent='Retrying...';retry.hidden=true;v.src='Muyiz.mp4?retry='+Date.now();start();});
v.addEventListener('volumechange',()=>{sound.textContent=v.muted?'Enable sound':'Mute sound';});
v.addEventListener('playing',()=>{clearTimeout(timer);play.hidden=true;retry.hidden=true;status.textContent='';});
v.addEventListener('waiting',()=>{status.textContent='Buffering...';slow();});
v.addEventListener('stalled',()=>{status.textContent='Waiting for the connection...';slow();});
v.addEventListener('error',()=>{clearTimeout(timer);status.textContent='Video could not load. Check your connection, retry, or open it directly.';play.hidden=true;retry.hidden=false;});
v.addEventListener('ended',()=>{clearTimeout(timer);play.textContent='Replay video';play.hidden=false;status.textContent='';});
start();
</script></body></html>
